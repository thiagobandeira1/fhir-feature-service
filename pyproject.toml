[project]
name = "fhir-feature-service"
version = "0.1.0"
description = "FastAPI microservice that ingests FHIR R4 bundles (Synthea) and normalizes them into patient feature tables in DuckDB for value-based-care analytics."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Thiago Bandeira", email = "thiagobatistanb@gmail.com" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "structlog>=24.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhir_features"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit (security)
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",
]
ignore = ["S101"]  # assert is fine (pytest); re-check non-test usage in review

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["fhir_features"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = "duckdb.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=fhir_features --cov-report=term-missing"
filterwarnings = ["error::DeprecationWarning:fhir_features.*"]

[tool.coverage.run]
source = ["src/fhir_features"]
